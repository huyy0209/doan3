services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy tạo .env từ .env.example và đặt mật khẩu SA}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - sql-backups:/var/opt/mssql/backup
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          else SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
          "$${SQLCMD}" -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  khoi-tao-csdl:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy tạo .env từ .env.example và đặt mật khẩu SA}
      NAP_DU_LIEU_MAU: ${NAP_DU_LIEU_MAU:-false}
    volumes:
      - ./Database:/Database:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -euo pipefail;
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
        else SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
        mkdir -p /tmp/doanweb-sql;
        chay_sql() {
          sed 's/QuanLyGiaSu/QuanLyGiaSu_Web/g' "/Database/$$1.sql" > "/tmp/doanweb-sql/$$1.sql";
          "$$SQLCMD" -S sql -U sa -P "$$MSSQL_SA_PASSWORD" -C -I -b -f 65001 -i "/tmp/doanweb-sql/$$1.sql";
        };
        for tep in /Database/0*.sql; do ten=$$(basename "$$tep" .sql); echo "Chạy $$ten.sql"; chay_sql "$$ten"; done;
        if [ "$${NAP_DU_LIEU_MAU,,}" = "true" ]; then
          for tep in /Database/1[1-6]_*.sql; do ten=$$(basename "$$tep" .sql); echo "Nạp dữ liệu mẫu $$ten.sql"; chay_sql "$$ten"; done;
        fi;
        echo "Đã khởi tạo QuanLyGiaSu_Web."
    restart: "no"

  web:
    build:
      context: .
      dockerfile: DoAnWeb/Dockerfile
    depends_on:
      khoi-tao-csdl:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__QuanLyGiaSu: "Server=sql;Database=QuanLyGiaSu_Web;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Hãy tạo .env từ .env.example và đặt mật khẩu SA};TrustServerCertificate=True;MultipleActiveResultSets=True"
      SaoLuu__ThuMuc: /backups
    ports:
      - "5080:8080"
    volumes:
      - ./DoAnWeb/logs:/app/logs
      - sql-backups:/backups
    restart: unless-stopped

volumes:
  sql-data:
  sql-backups:
